apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: garrug/surprise:backend
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          envFrom:
            - secretRef:
                name: database-credentials