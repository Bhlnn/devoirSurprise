apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-deployment
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      
      - name: web-app
        image: garrug/surprise:frontend
        ports:
        - containerPort: 8080
