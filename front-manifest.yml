apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-deployment
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      
      - name: frontend
        image: garrug/surprise:frontend
        ports:
        - containerPort: 80

  
  
